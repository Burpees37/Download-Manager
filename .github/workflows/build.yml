name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller yt-dlp pytest

      # A build is only published when every test passes, so auto-update
      # never hands out a broken version.
      - name: Run tests
        run: python -m pytest -q

      # The app compares this number with version.json on the Releases page
      # to know when a newer build is out.
      - name: Stamp build number
        shell: bash
        run: |
          sed -i "s/^BUILD = 0 /BUILD = ${{ github.run_number }} /" jmdm_app/config.py
          grep -q "^BUILD = ${{ github.run_number }} " jmdm_app/config.py
          python -c "import re,json;s=open('jmdm_app/config.py',encoding='utf-8').read();json.dump({'version':re.search(r'VERSION = \"([^\"]+)',s).group(1),'build':${{ github.run_number }},'commit':'${{ github.sha }}'},open('version.json','w'))"
          cat version.json

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name "JM Download Manager" --icon jmdm.ico
          --collect-submodules yt_dlp jmdm.py

      - name: Build browser helper (lets the extension start the app)
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name jmdm-host native_host.py

      - name: Add ffmpeg (for HD video)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffm
          Copy-Item (Get-ChildItem ffm -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist\

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item "dist\JM Download Manager.exe", dist\jmdm-host.exe, dist\ffmpeg.exe, README.md pkg\
          Copy-Item extension pkg\extension -Recurse
          Compress-Archive pkg\* JM-Download-Manager-Windows.zip

      # Every push to main refreshes the "Latest build" download on the Releases page.
      # (Releases don't use the account's limited Actions artifact storage.)
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest JM-Download-Manager-Windows.zip version.json --prerelease \
            --title "Latest build" --target "$GITHUB_SHA" \
            --notes "Built automatically from the newest code. Unzip, run JM Download Manager.exe, then load the extension folder in Chrome/Edge (see README)."

      - name: Publish versioned release (when you push a tag like v1.2.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JM-Download-Manager-Windows.zip
