name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller yt-dlp

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name "JM Download Manager" --icon jmdm.ico
          --collect-submodules yt_dlp jmdm.py

      - name: Add ffmpeg (for HD video)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffm
          Copy-Item (Get-ChildItem ffm -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist\

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item "dist\JM Download Manager.exe", dist\ffmpeg.exe, README.md pkg\
          Copy-Item extension pkg\extension -Recurse
          Compress-Archive pkg\* JM-Download-Manager-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: JM-Download-Manager-Windows
          path: JM-Download-Manager-Windows.zip

      - name: Publish release (when you push a tag like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JM-Download-Manager-Windows.zip
