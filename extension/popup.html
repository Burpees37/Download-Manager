<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px "Segoe UI", system-ui, sans-serif; width: 290px; margin: 0; padding: 14px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 7px 0; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: #aaa; }
  .on { background: #2e7d32; } .off { background: #c62828; }
  button { width: 100%; padding: 9px; margin-top: 8px; border: 0; border-radius: 6px;
           background: #2b7de9; color: #fff; font-weight: 600; cursor: pointer; }
  button.ghost { background: #eef3fb; color: #1d5fbf; }
  button:disabled { background: #9bbbe8; cursor: default; }
  #list div { padding: 7px 9px; margin-top: 4px; border-radius: 6px; background: #f3f6fb; cursor: pointer; }
  #list div:hover { background: #e2ebfa; }
  p { color: #666; font-size: 12px; margin: 10px 0 0; }
  hr { border: 0; border-top: 1px solid #e5e5e5; margin: 10px 0; }
  details { margin: 2px 0 6px; }
  summary { cursor: pointer; color: #1d5fbf; font-weight: 600; padding: 3px 0; }
  details label.f { display: block; margin: 8px 0 3px; color: #444; }
  textarea, input[type=number] { width: 100%; box-sizing: border-box; font: 12px "Segoe UI", system-ui, sans-serif;
           border: 1px solid #cfd6e0; border-radius: 5px; padding: 5px 6px; }
  textarea { height: 52px; resize: vertical; }
  input[type=number] { width: 90px; }
  .hint { color: #777; font-size: 11px; margin-top: 2px; }
  .link { all: unset; color: #1d5fbf; font-size: 11px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
  <h1>JM Download Manager</h1>
  <div class="row"><span><span id="dot" class="dot"></span><span id="state">Checking app…</span></span></div>
  <button id="start" class="ghost" hidden>Start the app</button>
  <hr>
  <div class="row"><label for="cap">Catch browser downloads</label><input type="checkbox" id="cap"></div>
  <details id="rules">
    <summary>Catch rules</summary>
    <label class="f" for="types">File types to catch</label>
    <textarea id="types" spellcheck="false"></textarea>
    <div class="hint">Blank = every type. <button class="link" id="reset">Use defaults</button></div>
    <label class="f" for="min">Skip files smaller than (KB)</label>
    <input type="number" id="min" min="0" step="100">
    <label class="f" for="excl">Never catch on these sites</label>
    <textarea id="excl" spellcheck="false" placeholder="drive.google.com mega.nz"></textarea>
    <div class="hint">Hold <b>Alt</b> while clicking a link to let the browser download it once.
      Same rules as the app's Settings.</div>
  </details>
  <div class="row"><label for="btn">Show button on videos</label><input type="checkbox" id="btn"></div>
  <div class="row"><label for="auto">Start the app when needed</label><input type="checkbox" id="auto"></div>
  <button id="vid">Download video on this tab</button>
  <button id="season" class="ghost">Download whole season from this page</button>
  <div id="list"></div>
  <p id="msg">Right-click any link → “Download with JM Download Manager”.</p>
  <script src="popup.js"></script>
</body>
</html>
